name: PR Base Check

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

jobs:
  check-base-branch:
    name: PR targets main
    runs-on: ubuntu-latest
    steps:
      - name: Verify PR base branch is main
        run: |
          if [ "${{ github.base_ref }}" != "main" ]; then
            echo "Pull requests must target main, not '${{ github.base_ref }}'."
            exit 1
          fi
          echo "PR correctly targets main."
